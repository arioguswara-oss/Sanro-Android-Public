name: SANRO Superadmin Android - Unsigned Release Candidate
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sanro-superadmin-android-release-unsigned.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unsigned-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: SanroSuperadmin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER" || { echo 'sdkmanager unavailable'; exit 1; }
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Run release lint
        run: gradle :app:lintRelease --no-daemon
      - name: Assemble unsigned release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Verify unsigned release identity
        run: |
          set -eu
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/sanro-badging.txt
          grep -q "package: name='com.sanrotech.superadmin'" /tmp/sanro-badging.txt
          grep -q "versionCode='3'" /tmp/sanro-badging.txt
          grep -q "versionName='1.0.2'" /tmp/sanro-badging.txt
          if "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$APK" >/dev/null 2>&1; then
            echo 'ERROR: release candidate was signed unexpectedly'
            exit 1
          fi
          echo 'Verified unsigned SANRO Superadmin com.sanrotech.superadmin v1.0.2 (code 3)'
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: sanro-superadmin-v1.0.2-RELEASE-UNSIGNED-OWNER-SIGNING-REQUIRED
          path: SanroSuperadmin/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 7
