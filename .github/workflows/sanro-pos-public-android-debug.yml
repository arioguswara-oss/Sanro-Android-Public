name: SANRO POS Public Android - Local Free MVP Debug
on:
  push:
    branches:
      - feature/pos-free-local-first-v0
      - feature/pos-free-functional-mvp-v1
      - feature/pos-public-android-native-auth-qa-20261029
      - feature/mobile-auth-contract-integration-20261030
      - feature/native-auth-security-implementation-20261030
    paths:
      - 'SanroPOSFree/**'
      - '.github/workflows/sanro-pos-public-android-debug.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'SanroPOSFree/**'
      - '.github/workflows/sanro-pos-public-android-debug.yml'

permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: SanroPOSFree
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER" || { echo 'sdkmanager unavailable'; exit 1; }
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Android lint
        run: gradle :app:lintDebug --no-daemon
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanro-pos-public-test-lint-reports
          path: |
            SanroPOSFree/app/build/reports/tests/
            SanroPOSFree/app/build/reports/lint-results-debug.*
          if-no-files-found: warn
      - name: Upload APK prototype artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanro-pos-public-free-debug-PROTOTYPE
          path: SanroPOSFree/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7


  # Exactly the APK from the preceding build job; no second unpinned build.
  android-emulator-smoke:
    name: Android emulator smoke (post-build)
    needs: android-debug
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download debug APK built by this workflow
        uses: actions/download-artifact@v4
        with:
          name: sanro-pos-public-free-debug-PROTOTYPE
          path: qa-apk
      - name: Enable KVM on hosted Ubuntu runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install APK and run nonproduction UI test in emulator (API 35)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 SanroPOSFree/tools/qa_android_smoke.py --apk qa-apk/app-debug.apk --out-dir qa-artifacts
      - name: Upload synthetic emulator QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanro-pos-public-emulator-smoke-qa
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 7
