name: SANRO Superadmin Android - Debug Build
on:
  push:
    branches: [main]
    paths:
      - 'SanroSuperadmin/**'
      - '.github/workflows/sanro-superadmin-android-debug.yml'
  pull_request:
    paths:
      - 'SanroSuperadmin/**'
      - '.github/workflows/sanro-superadmin-android-debug.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: SanroSuperadmin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub's ubuntu-latest runner already includes Android SDK command-line tools.
      # Avoid legacy setup-android package 'tools' that no longer exists.
      - name: Install Android SDK 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER" || { echo 'sdkmanager unavailable in Android SDK'; exit 1; }
          "$SDKMANAGER" --version
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Android lint
        run: gradle :app:lintDebug --no-daemon
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload debug-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanro-superadmin-v1.0.2-debug-UNSIGNED-FOR-PRODUCTION
          path: SanroSuperadmin/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
