plugins { id 'com.android.application' }
android {
    namespace 'com.sanrotech.pospublic'
    compileSdk 35
    defaultConfig {
        applicationId 'com.sanrotech.pospublic'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-local-mvp'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        debug { applicationIdSuffix '.uifixdebug'; manifestPlaceholders = [appLabel: 'SANRO POS UI TEST'] }
        release { minifyEnabled false; manifestPlaceholders = [appLabel: 'SANRO POS'] }
    }
    testOptions { unitTests.includeAndroidResources = true }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    sourceSets {
        test { resources.srcDir "$rootDir/docs" }
    }
}
dependencies {
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'org.json:json:20240303'
}
