plugins { id 'com.android.application' }

android {
    namespace 'com.sanrotech.superadmin'
    compileSdk 35

    defaultConfig {
        applicationId 'com.sanrotech.superadmin'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.0.2'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            minifyEnabled false
            // Deliberately no release signing credentials in source control.
            // Sign a private release with Owner-owned keystore via Android Studio.
        }
        debug { applicationIdSuffix '.debug' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    lint { abortOnError true }
}

dependencies { testImplementation 'junit:junit:4.13.2' }
